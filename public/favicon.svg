<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <!-- Rounded Background Card -->
    <rect x="5" y="5" width="90" height="90" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Axis Baseline -->
    <line x1="15" y1="80" x2="85" y2="80" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Bar 1 (Short, Dark Gray) -->
    <rect x="18" y="65" width="8" height="15" rx="2" fill="#475569" opacity="0.4" />
    
    <!-- Bar 2 (Medium Short, Gray) -->
    <rect x="30" y="55" width="8" height="25" rx="2" fill="#475569" opacity="0.7" />
    
    <!-- Bar 3 (Taller, White) -->
    <rect x="42" y="43" width="8" height="37" rx="2" fill="#f8fafc" />
    
    <!-- Bar 4 (Taller, White) -->
    <rect x="54" y="31" width="8" height="49" rx="2" fill="#f8fafc" />
    
    <!-- Bar 5 (Tallest, Accent Green) -->
    <rect x="66" y="19" width="8" height="61" rx="2" fill="#10b981" />
    
    <!-- Trendline (Accent Green) -->
    <path 
        d="M 22,72.5 L 34,67.5 L 46,55 L 58,43 L 70,24" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
    />
    
    <!-- Trendline Semicircle Over Bar 5 -->
    <path 
        d="M 66,19 A 4,4 0 0,1 74,19" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="2" 
        stroke-linecap="round"
    />
    
    <!-- Trendline Dots -->
    <circle cx="22" cy="72.5" r="2" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="34" cy="67.5" r="2" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="70" cy="24" r="2" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
</svg>