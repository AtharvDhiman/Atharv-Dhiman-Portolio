<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #09090b; rx: 40; }
      .orbit { stroke: #27272a; stroke-width: 1.5; fill: none; }
      .connection { stroke: #71717a; stroke-width: 1.5; fill: none; stroke-dasharray: 6 3; }
      .node { fill: #ffffff; filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8)); }
      .monogram { font-family: 'Bodoni Moda', 'Instrument Serif', Georgia, serif; font-size: 64px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="200" height="200" />

  <!-- Orbital circles -->
  <circle class="orbit" cx="100" cy="100" r="80" />
  <circle class="orbit" cx="100" cy="100" r="60" />

  <!-- Connections -->
  <path class="connection" d="M60,60 L100,40 L140,60 L140,140 L100,160 L60,140 Z" />
  <line class="connection" x1="100" y1="40" x2="100" y2="160" />
  <line class="connection" x1="60" y1="60" x2="140" y2="140" />
  <line class="connection" x1="140" y1="60" x2="60" y2="140" />

  <!-- Nodes -->
  <circle class="node" cx="100" cy="40" r="4.5" />
  <circle class="node" cx="140" cy="60" r="4.5" />
  <circle class="node" cx="140" cy="140" r="4.5" />
  <circle class="node" cx="100" cy="160" r="4.5" />
  <circle class="node" cx="60" cy="140" r="4.5" />
  <circle class="node" cx="60" cy="60" r="4.5" />

  <!-- Monogram -->
  <text class="monogram" x="100" y="106">AD</text>
</svg>