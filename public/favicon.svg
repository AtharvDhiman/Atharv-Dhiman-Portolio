<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #09090b; rx: 40; }
      .orbit { fill: none; stroke: rgba(255,255,255,0.2); stroke-width: 1.5; }
      .connection { fill: none; stroke: rgba(255,255,255,0.4); stroke-width: 1.5; stroke-dasharray: 6 6; }
      .node { fill: #ffffff; filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8)); }
      .monogram { font-family: 'Bodoni Moda', 'Instrument Serif', Georgia, serif; font-size: 58px; font-weight: 300; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="200" height="200" />

  <!-- Outer Ring -->
  <circle class="orbit" cx="100" cy="100" r="85" />
  <circle class="node" cx="185" cy="100" r="3.5" />
  <circle class="node" cx="15" cy="100" r="3.5" />
  <circle class="node" cx="100" cy="15" r="3.5" />
  <circle class="node" cx="100" cy="185" r="3.5" />

  <!-- Inner Connection Grid -->
  <path class="connection" d="M60,60 L140,60 L140,140 L60,140 Z" />
  <path class="connection" d="M100,40 L160,100 L100,160 L40,100 Z" />
  <circle class="node" cx="60" cy="60" r="4" />
  <circle class="node" cx="140" cy="60" r="4" />
  <circle class="node" cx="140" cy="140" r="4" />
  <circle class="node" cx="60" cy="140" r="4" />

  <!-- Monogram -->
  <text class="monogram" x="100" y="105">AD</text>
</svg>